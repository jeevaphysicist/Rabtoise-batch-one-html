<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box{
            border: 2px solid black;
            display: inline;
            /* margin: 20px; */
            padding: 20px;
            position: relative;
            top:20px;
        }

        @media screen and (max-width:600px){
            .box{
                border-radius: 10px;
            }
        }

        @media screen and (min-width:600px) and (max-width:1024px){
            .box{
                border-radius: 20px;
            }
        }

    </style>
</head>
<body>
     <div class="box">@media screen and (max-width:600px) =<600px </div>
</body>
</html>
