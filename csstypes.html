<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Types</title>
    <style>
         /* Class Selector   */
         .first-class-style {
            background-color: blue;
            color:white;
         }

         /* Id selector */
         #first-id-selector{
           background-color: chartreuse;
           color:blue;
         }

         /* GLobal selector */
         *{
            background-color: red;
            color :white
          }


         /* Tag Selector */
         h1 {
            background-color: cadetblue;
            color:blue;
         }

         /* global selector -> tag -> class or id -> inline style attritube   */
    </style>
</head>
<body>
     <!-- Inline Css -->
     <!-- Internal Css -->
     <!-- External Css -->

     <h1 class="first-class-style" style="color:orangered;" >This is Inline Css</h1>

     <h1 class="first-class-style">This is Internal Css class, id, global</h1>
     <h1 id="first-id-selector">ID Selector example</h1>
     <h1>Tag selector style applied...</h1>
     <p>This is paragraph tags styleing</p>
</body>
</html>
