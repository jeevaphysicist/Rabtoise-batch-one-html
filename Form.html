<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <div>
        <!-- Forms (Attributes : Style, src, width, height, target, href, type , start, for , id) -->
      <form id="form">
           <label for="first_name">First Name</label>
           <input id="first_name" type="text" placeholder="Enter First name" /> <br/>

           <label for="phone_no">Phone no</label>
           <input id="phone_no" type="number" placeholder="Enter Phone No" required /><br/>

           <label for="email">Email</label>
           <input id="email" type="email" placeholder="Enter Email..." required/><br/>

           <lable for="password">Password</lable>
           <input id="password" type="password" placeholder="Enter password..." /><br/>

           <div>Choose you Programming languages?</div>
           <input id="checkbox_1" type="checkbox" /> <label for="checkbox_1">HTML</label><br/>
           <input id="checkbox_2" type="checkbox" /> <label for="checkbox_2">CSS</label><br/>

           <div>Are you sure to submit this form?</div>
           <input name="radio_option" type="radio" /> <label>Yes </label><br/>
           <input name="radio_option" type="radio"/> <label>No</label><br/>

           <select >
            <option selected disabled>-select you area-</option>
              <option>Tamil Nadu</option>
              <option>Trichy</option>
              <option>Karur</option>
              <option>Coimbatore</option>
           </select><br/>

         <input type="range" min="0" max="20" /><br/>

         <input type="search" placeholder="Search by name" /><br/>

         <input type="file" /><br/>
         <input type="date" /><br/>
         <input type="color" /><br/>
         <input type="button" value="Click me" /><br/>


           <input type="submit" value="submit" />
      </form>

    </div>
</body>
</html>
