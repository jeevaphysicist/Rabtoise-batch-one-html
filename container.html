<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Tags</title>
</head>
<body>
     <!-- div (block level , take full width of the row) -->
      <div style="background-color: blue;">
        This is the div container
      </div>

     <!-- span (inline level, taken only necessary space) -->
      <span style="background-color: aquamarine;">
         This is the span conatiner
      </span>

</body>
</html>
