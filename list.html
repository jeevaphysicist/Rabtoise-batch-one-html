<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Topic</title>
</head>
<body>
    <!-- Ordered List -->
     <h1>Ordered ListS</h1>
     <ol type="a" start="5">
        <li>HTML</li>
        <li>CSS</li>
        <li>Javascript</li>
     </ol>

     <!-- Unordered list -->
       <ul>
         <li>Frist</li>
         <li>Second</li>
         <li>Third</li>
       </ul>

       <!-- Descriptive list -->           
       <dl>
          <dt>Descriptive title one</dt>
          <dd>This is the data </dd>
           <dt>Descriptive title Two</dt>
          <dd>This is the second data </dd>
       </dl>
</body>
</html>
