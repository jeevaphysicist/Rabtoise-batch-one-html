<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Manipulation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="h-screen flex items-center justify-center bg-gray-200 p-5">
     <form id="form" class="bg-white p-5 flex flex-col gap-4 " >
         <div class="flex items-start justify-center flex-col">
            <div class="flex items-start gap-2">
             <span class="text-gray-600"><i class="bi bi-envelope-fill"></i></span>
             <label class="text-gray-600" for="email">Email<sup class="ml-1 text-red-500">*</sup></label>
             </div>
             <input required placeholder="Enter your email" class="border border-gray-600 p-1 rounded-[5px]" type="email" id="emailid" name="email">
         </div>
         <div class="flex items-start justify-center flex-col">
            <div class="flex items-start gap-2">
             <span class="text-gray-600"><i class="bi bi-key"></i></span>
             <label class="text-gray-600" for="password">Password<sup class="ml-1 text-red-500">*</sup></label>
             </div>
             <input required placeholder="Enter your password" class="border border-gray-600 p-1 rounded-[5px]" type="password" id="password" name="password">
         </div>
         <button type="submit"  class=" w-[100%] bg-green-500 text-white p-2 rounded-[5px]">Login</button>
     </form>

     <script>
          let email = document.getElementById('emailid');
          let password = document.getElementById('password');
          let form = document.getElementById('form');
          let emailValue , passwordvalue;

          form.addEventListener('submit',function(e){
               e.preventDefault();
               console.log("form is submitted");
               emailValue = email.value;
               passwordvalue = password.value;

               let loginData = {
                    email:emailValue,
                    password:passwordvalue
               }
            //    console.log("Email value is ",emailValue);
            //    console.log("Password value is ",passwordvalue);
            console.log("login data is",loginData);
          })

          email.addEventListener('change',function(e){
               console.log("Email value is ",e.target.value);
          })

          password.addEventListener('change',function(e){
               console.log("Password value is ",e.target.value);
          })


     </script>
</body>
</html>
