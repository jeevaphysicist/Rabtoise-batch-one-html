<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops Concept</title>
</head>
<body>
     <script>
        // <!-- for , while and do while loops -->
        // For loop
        // for( intial variable; condition ; increment/decrement ){
        // }

        for(let i=0; i<10;i++){
            console.log("execute loop!", i, "<10"); 
        }

        // 0 <10
        // 1<10
        // 2<10
        // 3<10
        // 4<10
        // 5<10
        // 6<10
        // 7<10
        // 8<10
        // 9<10
        // 10 <10 

        // While Loop
        // while(condition){}
        let j=10;
        while(0<j){
            console.log("Execute While Loop", j, "<10");
             j--;
        }
        // do while loop
        // do{
        // }while(condition)

        let  k = 0;
        do{
            console.log("Execute Do While Loop", k, "0");
             k--;
        }while(0<k)

        
     </script>
</body>
</html>
