<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statement</title>
</head>
<body>
     <script>
        //  If else
        // switch case

        if(20 == 5){
          console.log("Execute If block...");
        }
        else{
             console.log("Execute Else Block");
        }


        switch("5"){
            case "1" : console.log("Execute Case value 1.."); break ;
            case "5" : console.log("Execuete Case value 5...");break;
            case "10" : console.log("Execute Case value 10 ....");break;
            default : console.log("Execute  Default case");
        }
     </script>
</body>
</html>
