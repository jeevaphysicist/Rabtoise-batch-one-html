<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>

    <script>
        // Arithmetic Operators - Done
        // Comparison Operators - Done
        // Logical Operators
        // Assignment Operatos -Done
        // Ternary Operators (Conditional Operator)

        // Arithmetic Operators 
        //  Plus , Minus, Multiplication, Division, Increment, Decrement 
        let a = 10;let b = 5;
        console.log("Plus:",a+b);
        console.log("Minus:", a-b);
        console.log("Multiplication:", a*b);
        console.log("Division:", a/b);

        // Post increment operator
        const postIncrement  = a++; 
        console.log("post Increament",postIncrement)
        console.log("Value of a after post increment",a);

        // PreIncrement Operator
        const preIncrement = ++b;
        console.log("Pre Increment:", preIncrement);
        console.log("Value of b after pre increment",b);


        // Post Decremnent Operator
        const postDecrement = a--;
        console.log("Post Decrement:",postDecrement);
        console.log("Value of a after post decrement",a);

        // Pre Decrement Operator
        const preDecrement = --b;
        console.log("Pre Decrement:", preDecrement);
        console.log("Value of b after pre decrement",b);

        // Comparison Operators
        // Equal To, Not Equal To, Greater than, Less than, Greater than or Equal to, Less than or Equal to
        const c = 10; const d = 10; 
        // Equal to 
        console.log("Equal To ", c == d);
        // tRUPLE EQUAL TO
        console.log("datatype of c", typeof c);
        console.log("datatype of d", typeof d);

        console.log("Triple Equal To ", c === d);

        const e = 12;

        // Not Equal To 
        console.log("Not Equal To", c != e);
        console.log("Not Triple Equal To", c !== e);

        // Greater than
        console.log("Greater Than", c > 12);
        console.log(" Greater Than or Equal to ", c >= 10);

        // Less than
        console.log("less than", c < 12);
        console.log("Less than or Equal to", c <= 10);
        console.log("Less than or Equal to", c <= 9);
        console.log("Less than or Equal to", c <= 11);


        // Logical Operators
        // AND, OR, NOT
        // Output  : Ture or False

        // && , || , !

        // And :
        // true && true = true
        // true && false = false
        // false && false = false
        // false && true = false
        let f=20, g=30, h=20, i=50;

        const outputandlogicalop = (f < g)  && (i > h)  ;
                                //   true   &&  true

        console.log("outputandlogicalop",outputandlogicalop);

        const logturefalse = (f<g) && (h>i);
                        //    true && false

      console.log("logturefalse",logturefalse);


       // OR :
        // true || true = true
        // true || false = true
        // false || false = false
        // false || true = true

         const outputORlogicalop = (f < g)  ||  (i > h)  ;
                                //  true || true 
        const TrueOrFalse = (g >f) || (g==f);
                        //  true || false 

        const falseORfalse = (g <= f) || (i === h);
                        //   false || false

        console.log("outputORlogicalop",outputORlogicalop);
        console.log("TrueOrFalse",TrueOrFalse);
        console.log("falseORfalse",falseORfalse);

        // not
        const NOTOutput = !(g === h)

        const NotFalseOutput = !(f === h)

        console.log("NOTOutput",NOTOutput);
        console.log("NotFalseOutput",NotFalseOutput);


        // Ternary Operator 
        //  ?:

        const ternaryOp = f != h  ? 40 : 50 ;

        console.log("ternaryOp",ternaryOp);


        function func1(){
             return "Jeeva";
        }

        function func2(){
            return 90+10;
        } 

        const resultFunc = false ? func1() : func2();

        console.log("resultFunc",resultFunc);










    </script>
    
</body>
</html>
