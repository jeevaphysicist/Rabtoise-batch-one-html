     <script>
        //  execute initally the try block code .
        // Execute the Catch block code if any error occurs in the try block.
          try{
            const a = 10;
            const b=5;
         
            const c = a+b;
            console.log("Sum is ",c);
               
          }
          catch(error){
            console.log("Error occurred: ",error);
          }
          finally{
            console.log("Finally block executed");
          }

        //   Promise error handling
        const promise = new Promise((resolve,reject)=>{
             if(false){
                resolve("Promise resolved successfully");
             }
             else{
                reject("Promise rejected due to some error");
             }
        })
        console.log("Promise is ",promise);
        promise.then((result)=>{
            console.log("Promise result is ",result);
        }).catch((error)=>{
            console.log("Promise error is ",error);
        })
