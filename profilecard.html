<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card</title>
    <style>
        .card{
             width:300px;
             height:500px;
             border:1px solid gray;
             box-shadow: 5px 1px  rgb(189, 188, 188);
             border-radius:20px;
             padding: 50px;
        }
        .avator{
             height: 50px;
             width: 50px;             
        }

        .avator img{
            height: 50px;
            width: 50px;  
            box-sizing: border-box;
            border: 1px solid gray;
            border-radius: 50%;
        }
        .name{
           color: gray;
        }

        .button{
             background-color: red;
             color:white;
        }

    </style>
</head>
<body>
     <div class="card">
        <div class="avator">
              <img src="./new2.png" alt="logo...">
        </div>
        <h1 class="name">Jeevanantham S</h1>
        <button class="button">Save</button>

     </div>
</body>
</html>
